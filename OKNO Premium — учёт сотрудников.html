<style>
:root{--bg:#fafafa;--card:#fff;--ink:#1f2328;--mut:#79808a;--line:#e4e6ea;--soft:#f3f4f6;--acc:#2f6fed;--no:#d92d3a;--ok:#16a34a;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 60px}
button,input,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px}
.lg{width:40px;height:40px;border-radius:9px;margin-right:8px;vertical-align:middle}
.hl{display:flex;align-items:center;flex:1 1 220px}
.co{border:none;background:none;font-size:22px;font-weight:700;padding:4px 0;width:min(100%,340px)}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.month b{min-width:130px;text-align:center;text-transform:capitalize}
.ib{width:36px;height:36px;border:none;background:var(--soft);border-radius:8px;cursor:pointer;font-size:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{margin:0 0 4px;font-size:16px}
.sub{color:var(--mut);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kp span{display:block;color:var(--mut);font-size:12px}
.kp b{font-size:22px}
input,select{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.grow{flex:1 1 150px}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.wrap{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
table.j{width:max-content;min-width:100%}
table.j th,table.j td{border:1px solid var(--line);padding:0;text-align:center}
table.j th{font-size:11px;font-weight:400;color:var(--mut);height:46px;min-width:38px;line-height:1.25;background:#fff}
table.j th b{display:block;font-size:13px;color:var(--ink)}
table.j .wk{background:var(--soft)}
table.j th.today b{color:var(--acc)}
table.j td.n{width:36px;color:var(--mut);font-size:12px}
table.j td.fio{text-align:left;min-width:180px}
table.j td.fio input{border:none;width:100%;height:38px;padding:0 8px;font-weight:600;border-radius:0}
.cell{width:38px;height:38px;border:none;background:none;cursor:pointer;font-size:20px;font-weight:700;padding:0;display:block;touch-action:manipulation}
.cell.v1{color:var(--ok);background:#ecfdf3}.cell.v2{color:var(--no);background:#fef2f2}
td.sm{font-weight:700;padding:0 8px!important;min-width:40px}
.x{border:none;background:none;color:var(--mut);cursor:pointer;font-size:15px;padding:8px}
.leg{margin-top:10px;font-size:13px;color:var(--mut)}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.t th{font-size:12px;color:var(--mut);font-weight:600}
table.t .r{text-align:right}
table.t tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc)}
.neg{color:var(--no)}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.err{background:#fee;color:#900;padding:8px 12px;margin-bottom:10px;border-radius:8px;font-size:13px}
.ver{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.rep{border:1px solid var(--line);border-radius:10px;padding:20px;margin-top:12px;background:#fff}
.rep h1{font-size:20px;margin:0 0 2px;border-bottom:2px solid #222;padding-bottom:6px}
.rep h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.rep table{border-collapse:collapse;width:100%}
.rep th,.rep td{border:1px solid #ccc;padding:5px 8px;text-align:left;font-size:13px}
.rep .r{text-align:right}
.rep .days{display:flex;flex-wrap:wrap}
.rep .d{width:36px;height:46px;border:1px solid #ccc;margin:-1px 0 0 -1px;text-align:center;font-size:10px;color:#777}
.rep .d.w{background:#f3f3f3}
.rep .d b{display:block;font-size:16px;line-height:24px;color:#222}
.rep .d b.n{color:#d92d3a}
</style>
</head>
<body>
<div id="app"></div>
<script>
var VER="v5";var LOGO=(document.querySelector('link[rel="apple-touch-icon"]')||{}).href||"";
var MN=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var WD=["вс","пн","вт","ср","чт","пт","сб"];
var CATS=["Аренда","Закупки","Транспорт","Коммуналка","Реклама","Налоги","Другое"];
var MET={cash:"Наличные",card:"Карта",usd:"Доллар"};
var S={co:"OKNO Premium",cur:"сум",usd:0,emps:[],att:{},pay:[],exp:[]};
var now=new Date(),pad=function(n){return String(n).padStart(2,"0")};
var todayStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
var ym=todayStr.slice(0,7),tab="att",repEmp="",dbDoc=null,timer=null,cloud=false,errMsg="";
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fmt=function(n){return Math.round(n).toLocaleString("ru-RU")};
var fmtP=function(n){return fmt(n).replace(/[\u00a0\u202f]/g," ")};
var $=function(s){return document.querySelector(s)};
var fd=function(d){return d.split("-").reverse().join(".")};
window.onerror=function(m){errMsg=String(m);var a=$("#app");if(a&&!$(".err"))a.insertAdjacentHTML("afterbegin",'<div class="err">Ошибка: '+esc(errMsg)+'</div>')};

/* ---------- хранение ---------- */
function save(){
  try{localStorage.setItem("ct4",JSON.stringify(S))}catch(e){}
  if(cloud&&dbDoc){clearTimeout(timer);timer=setTimeout(function(){dbDoc.set(JSON.parse(JSON.stringify(S))).catch(function(){})},500)}
}
function norm(d){
  if(!d||typeof d!=="object")return;
  S.co=(d.co&&d.co!="OKNO Premium")?d.co:S.co;S.cur=d.cur||S.cur;S.usd=+d.usd||0;
  S.emps=d.emps||[];S.att=d.att||{};S.pay=d.pay||[];S.exp=d.exp||[];
}
function connectCloud(initial){
  try{
    claude.use("db").then(function(db){
      if(!db){if(!initial)alert("Облако недоступно в этом окне");return}
      dbDoc=db.doc("v4/state");
      return dbDoc.get().then(function(s){
        if(s.exists&&!S.emps.length){norm(s.data())}
        cloud=true;try{localStorage.setItem("ct4cloud","1")}catch(e){}
        dbDoc.set(JSON.parse(JSON.stringify(S))).catch(function(){});
        render();
      });
    }).catch(function(){if(!initial)alert("Не удалось включить облако")});
  }catch(e){if(!initial)alert("Облако недоступно в этом окне")}
}
function load(){
  try{var l=localStorage.getItem("ct4");if(l)norm(JSON.parse(l))}catch(e){}
  render();
  var c=false;try{c=localStorage.getItem("ct4cloud")=="1"}catch(e){}
  if(c)connectCloud(true);
}

/* ---------- расчёты ---------- */
function dim(){var p=ym.split("-");return new Date(+p[0],+p[1],0).getDate()}
function dw(d){var p=ym.split("-");return new Date(+p[0],+p[1]-1,d).getDay()}
function getA(id,d){return(S.att[ym]&&S.att[ym][id]&&S.att[ym][id][d])||0}
function cnt(id,v){var o=(S.att[ym]||{})[id]||{},n=0;for(var k in o)if(o[k]==v)n++;return n}
function emp(id){return S.emps.filter(function(x){return x.id==id})[0]}
function mpay(id){return S.pay.filter(function(p){return p.date.slice(0,7)==ym&&(!id||p.emp==id)}).sort(function(a,b){return a.date<b.date?-1:1})}
function mexp(id){return S.exp.filter(function(e){return e.date.slice(0,7)==ym&&(!id||e.emp==id)}).sort(function(a,b){return a.date<b.date?-1:1})}
function loc(p){return(p.method=="usd")?(+p.amount||0)*(+S.usd||0):(+p.amount||0)}
function fa(p){return p.method=="usd"?"$ "+fmtP(p.amount):fmtP(p.amount)+" "+S.cur}
function paidL(id){return mpay(id).reduce(function(s,p){return s+loc(p)},0)}
function by(id){var o={cash:0,card:0,usd:0};mpay(id).forEach(function(p){o[p.method||"cash"]+=(+p.amount||0)});return o}
function accr(e){return cnt(e.id,1)*(+e.rate||0)}
function expSum(a){return a.reduce(function(s,e){return s+(+e.amount||0)},0)}
function dflt(){return todayStr.slice(0,7)==ym?todayStr:ym+"-01"}
function ptitle(){var y=ym.split("-");return MN[+y[1]-1]+" "+y[0]}
function opts(sel,blank){return(blank?'<option value="">'+blank+'</option>':'')+S.emps.map(function(e){return'<option value="'+e.id+'"'+(e.id==sel?" selected":"")+'>'+esc(e.name)+'</option>'}).join("")}
function dayCount(v){var n=0;S.emps.forEach(function(e){if(getA(e.id,+todayStr.slice(8))==v&&todayStr.slice(0,7)==ym)n++});return n}

/* ---------- действия (по data-a) ---------- */
var A={
  tab:function(el){tab=el.dataset.t;render()},
  pm:function(){shift(-1)},nm:function(){shift(1)},
  tg:function(el){
    var id=el.dataset.id,d=+el.dataset.d,w=$(".wrap"),l=w?w.scrollLeft:0,v=(getA(id,d)+1)%3;
    S.att[ym]=S.att[ym]||{};S.att[ym][id]=S.att[ym][id]||{};
    if(v)S.att[ym][id][d]=v;else delete S.att[ym][id][d];
    save();render();var w2=$(".wrap");if(w2)w2.scrollLeft=l},
  add:function(){var n=$("#nn").value.trim();if(!n){$("#nn").focus();return}
    S.emps.push({id:uid(),name:n,rate:+$("#nr").value||0});save();render()},
  del:function(el){var id=el.dataset.id,e=emp(id);
    if(e&&confirm("Удалить «"+e.name+"» вместе с отметками и выплатами?")){
      S.emps=S.emps.filter(function(x){return x.id!=id});S.pay=S.pay.filter(function(p){return p.emp!=id});
      for(var m in S.att)delete S.att[m][id];save();render()}},
  pay:function(){var pe=$("#pe").value,am=+$("#pa").value;if(!pe){$("#pe").focus();return}if(!am){$("#pa").focus();return}
    S.pay.push({id:uid(),emp:pe,amount:am,method:$("#pm").value,date:$("#pd").value||dflt(),note:$("#pn").value.trim()});save();render()},
  dpay:function(el){S.pay=S.pay.filter(function(p){return p.id!=el.dataset.id});save();render()},
  aexp:function(){var ea=+$("#ea").value;if(!ea){$("#ea").focus();return}
    S.exp.push({id:uid(),date:$("#ed").value||dflt(),cat:$("#ec").value,title:$("#et").value.trim(),emp:$("#ee").value,amount:ea});save();render()},
  dexp:function(el){S.exp=S.exp.filter(function(e){return e.id!=el.dataset.id});save();render()},
  pdf1:function(){var e=emp(repEmp);if(e)savePdf("Отчёт "+e.name+" "+ym+".pdf",[e])},
  pdfall:function(){if(S.emps.length)savePdf("Отчёты "+ym+".pdf",S.emps)},
  cloud:function(){connectCloud(false)}
};
var C={
  ren:function(el){var e=emp(el.dataset.id);if(e&&el.value.trim()){e.name=el.value.trim();save()}else if(e)el.value=e.name},
  rate:function(el){var e=emp(el.dataset.id);if(e){e.rate=+el.value||0;save();render()}},
  co:function(el){S.co=el.value.trim()||"OKNO Premium";save()},
  cur:function(el){S.cur=el.value.trim()||"сум";save();render()},
  usd:function(el){S.usd=+el.value||0;save();render()},
  rsel:function(el){repEmp=el.value;render()}
};
function shift(n){var p=ym.split("-"),d=new Date(+p[0],+p[1]-1+n,1);ym=d.getFullYear()+"-"+pad(d.getMonth()+1);render()}

/* нажатия: и click, и touch (без срабатывания при прокрутке) */
function bind(el){
  var sx=0,sy=0,mv=false,last=0;
  function fire(){var t=Date.now();if(t-last<450)return;last=t;var f=A[el.dataset.a];if(f)f(el)}
  el.addEventListener("click",fire);
  el.addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;mv=false},{passive:true});
  el.addEventListener("touchmove",function(e){var t=e.touches[0];if(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8)mv=true},{passive:true});
  el.addEventListener("touchend",function(e){if(!mv){e.preventDefault();fire()}});
}
function wire(){
  var a=document.querySelectorAll("[data-a]");for(var i=0;i<a.length;i++)bind(a[i]);
  var c=document.querySelectorAll("[data-c]");
  for(var j=0;j<c.length;j++)(function(el){el.addEventListener("change",function(){var f=C[el.dataset.c];if(f)f(el)})})(c[j]);
}

/* ---------- экраны ---------- */
function vAtt(){
  var n=dim(),h='<th>№</th><th style="text-align:left;padding-left:8px">Сотрудник</th>';
  for(var d=1;d<=n;d++){var w=dw(d)==0||dw(d)==6;h+='<th class="'+(w?"wk ":"")+(ym+"-"+pad(d)==todayStr?"today":"")+'"><b>'+d+'</b>'+WD[dw(d)]+'</th>'}
  h+='<th>Пр.</th><th>Н</th><th></th>';
  var rows=S.emps.map(function(e,i){
    var r='<td class="n">'+(i+1)+'</td><td class="fio"><input value="'+esc(e.name)+'" data-c="ren" data-id="'+e.id+'"></td>';
    for(var d=1;d<=n;d++){var v=getA(e.id,d),w=dw(d)==0||dw(d)==6;
      r+='<td class="'+(w?"wk":"")+'"><button type="button" class="cell v'+v+'" data-a="tg" data-id="'+e.id+'" data-d="'+d+'">'+(v==1?"✓":v==2?"н":"")+'</button></td>'}
    return'<tr>'+r+'<td class="sm" style="color:var(--ok)">'+cnt(e.id,1)+'</td><td class="sm neg">'+cnt(e.id,2)+'</td><td><button type="button" class="x" data-a="del" data-id="'+e.id+'" title="Удалить">✕</button></td></tr>'}).join("");
  return'<div class="kp"><div><span>Сотрудников</span><b>'+S.emps.length+'</b></div><div><span>Сегодня пришли</span><b style="color:var(--ok)">'+dayCount(1)+'</b></div><div><span>Сегодня нет</span><b class="neg">'+dayCount(2)+'</b></div></div>'+
  '<div class="box"><h2>Табель — '+ptitle()+'</h2><div class="sub">Нажмите на клетку: ✓ пришёл, н не пришёл, ещё раз — очистить.</div>'+
  (S.emps.length?'<div class="wrap"><table class="j"><thead><tr>'+h+'</tr></thead><tbody>'+rows+'</tbody></table></div><div class="leg">Пр. — дней пришёл · Н — дней не пришёл · выходные закрашены</div>':'<div class="empty">Список пуст. Добавьте первого сотрудника ниже.</div>')+'</div>'+
  '<div class="box"><h2>Добавить сотрудника</h2><div class="row"><input id="nn" class="grow" placeholder="ФИО"><input id="nr" type="number" style="width:150px" placeholder="Ставка за день"><button type="button" class="btn" data-a="add">Добавить</button></div></div>';
}
function vPay(){
  var rows=S.emps.map(function(e){
    var a=accr(e),p=paidL(e.id),l=a-p;
    return'<tr><td>'+esc(e.name)+'</td><td class="r">'+cnt(e.id,1)+'</td><td class="r"><input type="number" style="width:90px;text-align:right" value="'+(e.rate||"")+'" data-c="rate" data-id="'+e.id+'"></td><td class="r">'+fmt(a)+'</td><td class="r">'+fmt(p)+'</td><td class="r '+(l<0?"neg":"")+'"><b>'+fmt(l)+'</b></td></tr>'}).join("");
  var hist=mpay().map(function(p){var e=emp(p.emp);
    return'<tr><td>'+fd(p.date)+'</td><td>'+esc(e?e.name:"—")+'</td><td>'+MET[p.method||"cash"]+'</td><td>'+esc(p.note||"")+'</td><td class="r">'+fa(p)+'</td><td class="r"><button type="button" class="x" data-a="dpay" data-id="'+p.id+'">✕</button></td></tr>'}).join("");
  return'<div class="box"><h2>Выдать деньги</h2><div class="row"><select id="pe" class="grow">'+opts("","Выберите сотрудника")+'</select>'+
  '<select id="pm">'+Object.keys(MET).map(function(k){return'<option value="'+k+'">'+MET[k]+'</option>'}).join("")+'</select>'+
  '<input id="pa" type="number" style="width:130px" placeholder="Сумма"><input id="pd" type="date" value="'+dflt()+'"><input id="pn" class="grow" placeholder="Примечание"><button type="button" class="btn" data-a="pay">Выдать</button></div></div>'+
  '<div class="box"><h2>Расчёт — '+ptitle()+'</h2><div class="sub">Начислено = дни «пришёл» × ставка. Доллары пересчитываются по курсу из раздела «Итого».</div>'+
  (S.emps.length?'<div class="wrap"><table class="t"><thead><tr><th>Сотрудник</th><th class="r">Дней</th><th class="r">Ставка</th><th class="r">Начислено</th><th class="r">Выдано</th><th class="r">Остаток</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Сначала добавьте сотрудников в табеле</div>')+'</div>'+
  '<div class="box"><h2>Выплаты за месяц</h2>'+(hist?'<div class="wrap"><table class="t"><thead><tr><th>Дата</th><th>Сотрудник</th><th>Способ</th><th>Примечание</th><th class="r">Сумма</th><th></th></tr></thead><tbody>'+hist+'</tbody></table></div>':'<div class="empty">Выплат нет</div>')+'</div>';
}
function vExp(){
  var items=mexp(),c={},tot=expSum(items);items.forEach(function(e){c[e.cat]=(c[e.cat]||0)+(+e.amount||0)});
  var cr=Object.keys(c).sort(function(a,b){return c[b]-c[a]}).map(function(k){return'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>'+esc(k)+'</span><b>'+fmt(c[k])+'</b></div><div class="bar"><i style="width:'+(c[k]/tot*100)+'%"></i></div></div>'}).join("");
  var list=items.map(function(e){var m=emp(e.emp);return'<tr><td>'+fd(e.date)+'</td><td>'+esc(e.cat)+'</td><td>'+esc(e.title||"")+'</td><td>'+(m?esc(m.name):"Общий")+'</td><td class="r">'+fmt(e.amount)+'</td><td class="r"><button type="button" class="x" data-a="dexp" data-id="'+e.id+'">✕</button></td></tr>'}).join("");
  return'<div class="box"><h2>Записать расход</h2><div class="row"><input id="ed" type="date" value="'+dflt()+'"><select id="ec">'+CATS.map(function(k){return'<option>'+k+'</option>'}).join("")+'</select>'+
  '<input id="et" class="grow" placeholder="На что потратили"><select id="ee">'+opts("","Общий расход")+'</select><input id="ea" type="number" style="width:130px" placeholder="Сумма"><button type="button" class="btn" data-a="aexp">Записать</button></div><div class="sub" style="margin-top:6px">Если расход связан с сотрудником, выберите его — он попадёт в его отчёт.</div></div>'+
  '<div class="box"><h2>Расходы — '+ptitle()+'</h2>'+(list?'<div class="wrap"><table class="t"><thead><tr><th>Дата</th><th>Категория</th><th>Описание</th><th>Относится к</th><th class="r">Сумма</th><th></th></tr></thead><tbody>'+list+'</tbody><tfoot><tr><td colspan="4">Итого</td><td class="r">'+fmt(tot)+' '+esc(S.cur)+'</td><td></td></tr></tfoot></table></div>':'<div class="empty">Расходов нет</div>')+'</div>'+
  (cr?'<div class="box"><h2>По категориям</h2>'+cr+'</div>':'');
}
function vSum(){
  var Ac=0,P=0,pb={cash:0,card:0,usd:0},E=expSum(mexp());
  S.emps.forEach(function(e){Ac+=accr(e);P+=paidL(e.id);var b=by(e.id);for(var k in b)pb[k]+=b[k]});
  var rows=S.emps.map(function(e){var a=accr(e),p=paidL(e.id);return'<tr><td>'+esc(e.name)+'</td><td class="r">'+cnt(e.id,1)+'</td><td class="r">'+cnt(e.id,2)+'</td><td class="r">'+fmt(a)+'</td><td class="r">'+fmt(p)+'</td><td class="r '+(a-p<0?"neg":"")+'">'+fmt(a-p)+'</td></tr>'}).join("");
  var warn=(pb.usd>0&&!(+S.usd))?'<div class="sub neg" style="margin-top:6px">Укажите курс доллара ниже, чтобы доллары вошли в общий итог.</div>':'';
  return'<div class="kp"><div><span>Начислено</span><b>'+fmt(Ac)+'</b></div><div><span>Выдано</span><b>'+fmt(P)+'</b></div><div><span>Расходы</span><b>'+fmt(E)+'</b></div><div><span>Всего ушло</span><b>'+fmt(P+E)+'</b></div></div>'+
  '<div class="box"><h2>Итого — '+ptitle()+'</h2><table class="t" style="margin-top:10px"><tbody>'+
  '<tr><td>Выдано наличными</td><td class="r">'+fmt(pb.cash)+' '+esc(S.cur)+'</td></tr>'+
  '<tr><td>Выдано картой</td><td class="r">'+fmt(pb.card)+' '+esc(S.cur)+'</td></tr>'+
  '<tr><td>Выдано в долларах</td><td class="r">$ '+fmt(pb.usd)+'</td></tr>'+
  '<tr><td>Осталось выдать</td><td class="r '+(Ac-P<0?"neg":"")+'"><b>'+fmt(Ac-P)+' '+esc(S.cur)+'</b></td></tr></tbody>'+
  '<tfoot><tr><td>Выплаты + расходы</td><td class="r">'+fmt(P+E)+' '+esc(S.cur)+'</td></tr></tfoot></table>'+warn+'</div>'+
  '<div class="box"><h2>По сотрудникам</h2>'+(rows?'<div class="wrap"><table class="t"><thead><tr><th>Сотрудник</th><th class="r">Пр.</th><th class="r">Н</th><th class="r">Начислено</th><th class="r">Выдано</th><th class="r">Остаток</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Нет сотрудников</div>')+'</div>'+
  '<div class="box"><h2>Настройки</h2><div class="row"><span class="sub">Валюта:</span><input value="'+esc(S.cur)+'" style="width:90px" data-c="cur"><span class="sub">Курс доллара:</span><input type="number" value="'+(S.usd||"")+'" style="width:110px" placeholder="1 $ =" data-c="usd"></div>'+
  '<div class="row"><button type="button" class="btn g" data-a="cloud">'+(cloud?"☁ Облако включено":"☁ Сохранять ещё и в облаке")+'</button></div><div class="sub" style="margin-top:6px">Данные уже сохраняются в этом браузере. Облако — для резервной копии и доступа с другого устройства.</div></div>';
}
function repHtml(e){
  var n=dim(),days="";
  for(var d=1;d<=n;d++){var v=getA(e.id,d),w=dw(d)==0||dw(d)==6;
    days+='<div class="d'+(w?" w":"")+'">'+d+'<b'+(v==2?' class="n"':'')+'>'+(v==1?"✓":v==2?"н":"&nbsp;")+'</b>'+WD[dw(d)]+'</div>'}
  var pr=cnt(e.id,1),ab=cnt(e.id,2),un=n-pr-ab,a=accr(e),b=by(e.id),P=paidL(e.id);
  var ps=mpay(e.id).map(function(p){return'<tr><td>'+fd(p.date)+'</td><td>'+MET[p.method||"cash"]+'</td><td>'+esc(p.note||"")+'</td><td class="r">'+fa(p)+'</td></tr>'}).join("");
  var ex=mexp(e.id),es=ex.map(function(x){return'<tr><td>'+fd(x.date)+'</td><td>'+esc(x.cat)+'</td><td>'+esc(x.title||"")+'</td><td class="r">'+fmt(x.amount)+' '+esc(S.cur)+'</td></tr>'}).join("");
  return'<h1>'+esc(e.name)+'</h1><div>'+esc(S.co)+' · отчёт за '+ptitle()+'</div>'+
  '<h3>Посещаемость</h3><div class="days">'+days+'</div>'+
  '<table style="margin-top:8px"><tr><td>Пришёл (дней)</td><td class="r">'+pr+'</td><td>Не пришёл (дней)</td><td class="r">'+ab+'</td><td>Не отмечено</td><td class="r">'+un+'</td></tr></table>'+
  '<h3>Зарплата</h3><table><tr><td>Ставка за день</td><td class="r">'+fmt(e.rate||0)+' '+esc(S.cur)+'</td></tr><tr><td>Начислено ('+pr+' дн.)</td><td class="r">'+fmt(a)+' '+esc(S.cur)+'</td></tr>'+
  '<tr><td>Получил наличными</td><td class="r">'+fmt(b.cash)+' '+esc(S.cur)+'</td></tr><tr><td>Получил на карту</td><td class="r">'+fmt(b.card)+' '+esc(S.cur)+'</td></tr><tr><td>Получил в долларах</td><td class="r">$ '+fmt(b.usd)+'</td></tr>'+
  '<tr><td><b>Всего получил (в '+esc(S.cur)+')</b></td><td class="r"><b>'+fmt(P)+'</b></td></tr><tr><td><b>Остаток к выдаче</b></td><td class="r"><b>'+fmt(a-P)+' '+esc(S.cur)+'</b></td></tr></table>'+
  '<h3>Выплаты</h3>'+(ps?'<table><tr><th>Дата</th><th>Способ</th><th>Примечание</th><th class="r">Сумма</th></tr>'+ps+'</table>':'<div>Выплат за месяц не было.</div>')+
  '<h3>Расходы, связанные с сотрудником</h3>'+(es?'<table><tr><th>Дата</th><th>Категория</th><th>Описание</th><th class="r">Сумма</th></tr>'+es+'<tr><td colspan="3"><b>Итого</b></td><td class="r"><b>'+fmt(expSum(ex))+' '+esc(S.cur)+'</b></td></tr></table>':'<div>Расходов нет.</div>');
}
function vRep(){
  if(!emp(repEmp))repEmp=S.emps[0]?S.emps[0].id:"";
  var e=emp(repEmp);
  return'<div class="box"><h2>Отчёт по сотруднику</h2><div class="sub">Выберите сотрудника — отчёт за '+ptitle()+' соберётся сам. Кнопка сохранит его в PDF-файл.</div>'+
  '<div class="row"><select class="grow" data-c="rsel">'+opts(repEmp,S.emps.length?"":"Нет сотрудников")+'</select><button type="button" class="btn" data-a="pdf1">Скачать PDF</button><button type="button" class="btn g" data-a="pdfall">PDF всех сотрудников</button></div>'+
  (e?'<div class="rep">'+repHtml(e)+'</div>':'<div class="empty">Добавьте сотрудников в табеле</div>')+'</div>';

function render(){
  var y=ym.split("-"),T=[["att","Табель"],["pay","Зарплата"],["exp","Расходы"],["sum","Итого"],["rep","Отчёты"]];
  var body=tab=="att"?vAtt():tab=="pay"?vPay():tab=="exp"?vExp():tab=="sum"?vSum():vRep();

  '<div class="tabs">'+T.map(function(t){return'<button type="button" data-a="tab" data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div>'+body+'<div class="ver">'+VER+'</div>';
  wire();

/* ---------- PDF (рисуем страницы на canvas и собираем PDF сами) ---------- */
function buildPdf(pages){
  var enc=new TextEncoder(),chunks=[],offs=[],len=0;
  function put(x){var u=typeof x=="string"?enc.encode(x):x;chunks.push(u);len+=u.length}
  function obj(n,fn){offs[n]=len;put(n+" 0 obj\n");fn();put("\nendobj\n")}
  put("%PDF-1.4\n");
  var N=2+pages.length*3;
  obj(1,function(){put("<< /Type /Catalog /Pages 2 0 R >>")});
  obj(2,function(){var k=[];for(var i=0;i<pages.length;i++)k.push((3+i*3)+" 0 R");put("<< /Type /Pages /Kids ["+k.join(" ")+"] /Count "+pages.length+" >>")});
  pages.forEach(function(p,i){
    var pg=3+i*3,ct=4+i*3,im=5+i*3,c="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
    obj(pg,function(){put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>")});
    obj(ct,function(){put("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream")});
    obj(im,function(){put("<< /Type /XObject /Subtype /Image /Width "+p.w+" /Height "+p.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+p.bytes.length+" >>\nstream\n");put(p.bytes);put("\nendstream")});
  });
  var xr=len;
  var t="xref\n0 "+(N+1)+"\n0000000000 65535 f \n";
  for(var i=1;i<=N;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  t+="trailer\n<< /Size "+(N+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF\n";
  put(t);
  var out=new Uint8Array(len),o=0;chunks.forEach(function(c){out.set(c,o);o+=c.length});
  return out;
}
function drawReports(list){
  var pages=[],cx,y,PWd=794,PHt=1123,L=40,R=754;
  function np(){var c=document.createElement("canvas");c.width=PWd*2;c.height=PHt*2;cx=c.getContext("2d");cx.scale(2,2);cx.fillStyle="#fff";cx.fillRect(0,0,PWd,PHt);cx.textBaseline="middle";pages.push(c);y=48}
  function need(h){if(y+h>PHt-60)np()}
  function T(s,x,yy,size,bold,col,al){cx.font=(bold?"bold ":"")+size+"px Arial, Helvetica, sans-serif";cx.fillStyle=col||"#222";cx.textAlign=al||"left";cx.fillText(String(s),x,yy)}
  function clip(s,w,size){cx.font=size+"px Arial, Helvetica, sans-serif";s=String(s);while(s.length>1&&cx.measureText(s).width>w)s=s.slice(0,-2)+"…";return s}
  function ln(y1,col,w){cx.strokeStyle=col||"#999";cx.lineWidth=w||1;cx.beginPath();cx.moveTo(L,y1);cx.lineTo(R,y1);cx.stroke()}
  function sec(t){need(40);y+=14;T(t.toUpperCase(),L,y,12,true,"#555");y+=12;ln(y,"#ccc",1);y+=14}
  function kv(k,v,bold){need(24);T(k,L,y,13,bold);T(v,R,y,13,bold,"#222","right");y+=11;ln(y,"#e5e5e5",1);y+=13}
  list.forEach(function(e,idx){
    np();
    T(e.name,L,y,24,true);y+=18;ln(y,"#222",2);y+=16;
    T(S.co+" · отчёт за "+ptitle(),L,y,13,false,"#555");y+=10;
    sec("Посещаемость");
    var n=dim(),bw=34,bh=46,per=21;
    for(var d=1;d<=n;d++){
      var col=(d-1)%per,row=Math.floor((d-1)/per),x=L+col*bw,yy=y+row*bh,v=getA(e.id,d),w=dw(d)==0||dw(d)==6;
      cx.fillStyle=v==1?"#ecfdf3":v==2?"#fef2f2":w?"#f1f1f1":"#fff";cx.fillRect(x,yy,bw,bh);
      cx.strokeStyle="#bbb";cx.lineWidth=1;cx.strokeRect(x,yy,bw,bh);
      T(d,x+bw/2,yy+9,10,false,"#777","center");
      if(v==1){cx.strokeStyle="#16a34a";cx.lineWidth=2.6;cx.beginPath();cx.moveTo(x+bw/2-7,yy+bh/2+2);cx.lineTo(x+bw/2-2,yy+bh/2+8);cx.lineTo(x+bw/2+8,yy+bh/2-5);cx.stroke()}
      else if(v==2)T("н",x+bw/2,yy+bh/2+3,18,true,"#d92d3a","center");
      T(WD[dw(d)],x+bw/2,yy+bh-8,9,false,"#999","center");
    }
    y+=Math.ceil(n/per)*bh+18;
    var pr=cnt(e.id,1),ab=cnt(e.id,2);
    T("Пришёл: "+pr+" дн.    Не пришёл: "+ab+" дн.    Не отмечено: "+(n-pr-ab)+" дн.",L,y,13,true);y+=12;
    var a=accr(e),b=by(e.id),P=paidL(e.id);
    sec("Зарплата за месяц");
    kv("Ставка за день",fmtP(e.rate||0)+" "+S.cur);
    kv("Начислено ("+pr+" дн.)",fmtP(a)+" "+S.cur);
    kv("Получил наличными",fmtP(b.cash)+" "+S.cur);
    kv("Получил на карту",fmtP(b.card)+" "+S.cur);
    kv("Получил в долларах","$ "+fmtP(b.usd));
    kv("Всего получил (в "+S.cur+")",fmtP(P),true);
    kv("Остаток к выдаче",fmtP(a-P)+" "+S.cur,true);
    var ps=mpay(e.id);
    sec("Выплаты");
    if(!ps.length){need(24);T("Выплат за месяц не было",L,y,13,false,"#777");y+=14}
    ps.forEach(function(p){need(24);T(fd(p.date),L,y,13);T(MET[p.method||"cash"],130,y,13);T(clip(p.note||"",300,13),240,y,13,false,"#555");T(fa(p),R,y,13,true,"#222","right");y+=11;ln(y,"#e5e5e5",1);y+=13});
    var ex=mexp(e.id);
    sec("Расходы, связанные с сотрудником");
    if(!ex.length){need(24);T("Расходов нет",L,y,13,false,"#777");y+=14}
    ex.forEach(function(x){need(24);T(fd(x.date),L,y,13);T(clip(x.cat,100,13),130,y,13);T(clip(x.title||"",300,13),240,y,13,false,"#555");T(fmtP(x.amount)+" "+S.cur,R,y,13,true,"#222","right");y+=11;ln(y,"#e5e5e5",1);y+=13});
    if(ex.length)kv("Итого расходов",fmtP(expSum(ex))+" "+S.cur,true);
    need(70);y+=30;
    cx.strokeStyle="#777";cx.lineWidth=1;cx.beginPath();cx.moveTo(L,y);cx.lineTo(L+220,y);cx.moveTo(R-220,y);cx.lineTo(R,y);cx.stroke();
    T("Руководитель",L,y+12,11,false,"#777");T("Сотрудник",R-220,y+12,11,false,"#777");
  });
  return pages;
}
function savePdf(name,list){
  try{
    var cs=drawReports(list),pg=cs.map(function(c){
      var b=atob(c.toDataURL("image/jpeg",0.92).split(",")[1]),u=new Uint8Array(b.length);
      for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      return{bytes:u,w:c.width,h:c.height}});
    var pdf=buildPdf(pg);
    claude.use("downloads").then(function(dl){
      if(!dl){alert("Скачивание недоступно в этом окне. Откройте программу по ссылке в обычном браузере.");return}
      return dl.save({filename:name,data:pdf}).catch(function(){alert("Не удалось сохранить файл")});
    }).catch(function(){alert("Скачивание недоступно в этом окне")});
  }catch(e){alert("Ошибка при создании PDF: "+e.message)}
}
